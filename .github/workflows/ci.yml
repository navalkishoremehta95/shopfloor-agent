name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q
      - name: Retrieve eval gate
        run: python -m shopfloor eval-retrieve --min-hit-at-1 0.7
